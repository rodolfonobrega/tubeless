[tool.poetry]
name = "tubeless"
version = "1.1.0"
description = "Backend for TubeLess - Search, fetch, and synthesize knowledge from YouTube videos"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
python-multipart = "^0.0.6"
sqlalchemy = "^2.0.25"
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.9"
alembic = "^1.13.1"
pydantic = "^2.5.3"
pydantic-settings = "^2.1.0"
litellm = "^1.35.0"
openai = "^1.10.0"
anthropic = "^0.18.0"
yt-dlp = "^2024.1.0"
youtube-transcript-api = "^1.0.0"
python-dotenv = "^1.0.0"
httpx = "^0.26.0"
websockets = "^12.0"
tiktoken = "^0.5.2"
pgvector = "^0.2.1"
structlog = "^24.4.0"
flashrank = "^0.2.9"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"
pytest-asyncio = "^0.23.3"
black = "^24.1.1"
ruff = "^0.1.14"
mypy = "^1.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
